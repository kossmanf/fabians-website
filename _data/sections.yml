  title: "Über mich"
  text: |
    Ich kombiniere gerne mathematisches Denken mit praktischer Umsetzung. Besonders spannend finde ich Probleme, bei denen Unsicherheit, Entscheidungen und reale Daten zusammentreffen – z. B. Empfehlungssysteme, Simulation von komplexen Systemen oder Gesundheits-/Routing-Optimierung.

    Wenn ich nicht gerade code, mache ich Sport (Gym, Laufen) und denke über faire, datengetriebene Systeme für Gesellschaft und Technik nach.

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
    {% if page.title %}
        {{ page.title }} · {{ site.title }}
    {% else %}
        {{ site.title }}
    {% endif %}
</title>
{% if page.translation_url %}
    <link rel="alternate"
          hreflang="{% if page.lang == 'en' %}de{% else %}en{% endif %}"
          href="{{ page.translation_url | relative_url }}">
{% endif %}
{% assign asset_version = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_version }}" defer></script>
